{% if show_toolbar or auto_export_pdf %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  (function () {
    var canvasNode = document.getElementById('certificate-canvas');
    var btnPdf = document.getElementById('btn-pdf');
    var autoExportPdf = {{ 'true' if auto_export_pdf else 'false' }};
    var BG = '#080A12';
    function setBusy(on) { if (btnPdf) btnPdf.disabled = on; }
    async function renderCertificate() {
      return await html2canvas(canvasNode, {
        scale: 2, useCORS: true, backgroundColor: BG, logging: false,
        onclone: function (doc) {
          doc.querySelectorAll('.toolbar').forEach(function (el) { el.style.display = 'none'; });
        }
      });
    }
    async function exportPdf() {
      setBusy(true);
      try {
        var src = await renderCertificate();
        var img = src.toDataURL('image/png');
        var jsPDF = window.jspdf.jsPDF;
        var doc = new jsPDF({
          orientation: src.width >= src.height ? 'landscape' : 'portrait',
          unit: 'px',
          format: [src.width, src.height],
          hotfixes: ['px_scaling']
        });
        doc.addImage(img, 'PNG', 0, 0, src.width, src.height, undefined, 'FAST');
        if (autoExportPdf) {
          window.location.replace(doc.output('bloburl'));
        } else {
          doc.save('{{ export_filename or ('hacklabs-certificate-' ~ learner ~ '.pdf') }}');
        }
      } catch (e) { console.error('PDF export error:', e); }
      finally { setBusy(false); }
    }
    if (btnPdf) {
      btnPdf.addEventListener('click', exportPdf);
    }
    if (autoExportPdf) {
      window.addEventListener('load', function () {
        window.setTimeout(exportPdf, 120);
      });
    }
  })();
</script>
{% endif %}
